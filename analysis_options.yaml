# Konfigurasi analyzer. Jalankan `flutter analyze` sebelum commit; hasilnya
# harus tanpa error dan warning.
include: package:flutter_lints/flutter.yaml

analyzer:
  # Folder platform dan hasil build bukan kode Dart milik proyek.
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
